<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-content">
        <header class="hero">
            <h1>Happy Birthday <span id="person-name">ANSHUU ❤️</span>!</h1>
            <p>A special surprise created just for you 🎉</p>
        </header>

        <section class="gallery">
            <h2>Memories</h2>
            <div class="photo-grid">
                <img src="assets/photos/photo1.jpg" alt="Memory 1">
                <img src="assets/photos/photo2.jpg" alt="Memory 2">
                <img src="assets/photos/photo3.jpg" alt="Memory 3">
                <img src="assets/photos/special.jpg" alt="Special Memory">
            </div>
        </section>

        <section class="message-box">
            <h2>A Special Wish ✨</h2>
            <p>Wishing you a day filled with love, joy, and unforgettable moments!</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
